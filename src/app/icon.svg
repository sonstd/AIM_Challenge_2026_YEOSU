<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!--
    여수 바다 + 등대. 파비콘은 16px까지 줄어들므로 형태를 세 덩어리
    (등대 · 불빛 · 물결)로만 단순화하고, 흰 등대가 묻히지 않도록
    바다색을 충분히 어둡게 잡았다.
  -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c8ec4" />
      <stop offset="100%" stop-color="#004d7c" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#sea)" />

  <!-- 등대 지붕과 랜턴실 -->
  <path d="M32 7 44 19 20 19 Z" fill="#ffffff" />
  <rect x="22" y="20" width="20" height="11" rx="3" fill="#ffffff" />
  <circle cx="32" cy="25.5" r="4.2" fill="#f5a524" />

  <!-- 탑신 -->
  <path d="M24 32 H40 L44 56 H20 Z" fill="#ffffff" />
  <path d="M25.2 39 H38.8 L39.7 45 H24.3 Z" fill="#f5a524" />

  <!-- 물결 -->
  <path
    d="M0 51 q8 -6 16 0 t16 0 t16 0 t16 0 V64 H0 Z"
    fill="#ffffff"
    opacity="0.35"
  />
  <path
    d="M0 57 q8 -5 16 0 t16 0 t16 0 t16 0 V64 H0 Z"
    fill="#ffffff"
    opacity="0.95"
  />
</svg>
